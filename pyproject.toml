# Description: Project configuration for scry, a temporal infrastructure failure-prediction tool.
# Description: Distribution name "scryml" (scry is taken on PyPI); import package "scry".

[project]
name = "scryml"
version = "0.2.0"
description = "Predict infrastructure failure states from a stream of metrics"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ryanmat" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "duckdb>=1.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34.0"]
azure = ["azure-identity>=1.15.0"]
logicmonitor = ["httpx>=0.26.0"]
forecast = ["transformers>=4.35.0", "chronos-forecasting>=2.0"]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-logging>=0.41b0",
]
mcp = []  # reserved for the phase-2 MCP server
vus = []  # reserved: the VUS-PR backend is overlaid, not locked (docs/evaluation.md)
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "matplotlib>=3.8.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/ryanmat/scry"
Repository = "https://github.com/ryanmat/scry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration and not vus_backend\"')",
    "vus_backend: needs the optional 'vus' backend, which is not in uv.lock; deselected by default, run with 'uv run --all-extras --with vus python -m pytest -m vus_backend'",
]
# The vus_backend tests are deselected rather than skipped: the backend is overlaid
# by the operator (docs/evaluation.md) and is absent from every sandbox and CI job.
# A -m on the command line replaces this one, which is how those tests are selected
# (through python -m pytest: the overlay is not visible to the venv's pytest script).
addopts = "-m 'not vus_backend'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# torch on Linux comes from the PyTorch CPU index: the PyPI wheel drags fifteen nvidia packages
# (4.5 GB installed) onto hosts that have no NVIDIA device, and every Linux host that runs scry
# is one of those. macOS and Windows keep the PyPI wheel.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
